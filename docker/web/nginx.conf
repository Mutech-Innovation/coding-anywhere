# Static hosting for the Coding Anywhere web client.
#
# The app is a single-page React build with no router server: main.tsx branches
# on window.location.pathname (notably `/guest` for share links), so every
# unknown path must fall back to index.html. Assets under /assets/ are
# content-hashed (safe to cache forever); index.html and the service worker
# must NOT be cached so a redeploy is picked up immediately.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Light compression. (Traefik can also compress; this is cheap and helps if
    # something bypasses the proxy.)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Content-hashed build output — immutable, cache hard.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker controls update delivery; it must never be cached.
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback: serve index.html for any path (incl. /guest, /guest/).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
